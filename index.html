<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Bootstrap</title>
</head>
<body>
<div class="container text-center py-4">

    <div class="row mb-3">
        <div class="col-12">
            <div class="border bg-light p-5">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">

                        <a class="navbar-brand" href="#">Мій сайт</a>

                        <button
                                class="navbar-toggler"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#mainMenu"
                                aria-controls="mainMenu"
                                aria-expanded="false"
                                aria-label="Відкрити меню"
                        >
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <div class="collapse navbar-collapse" id="mainMenu">
                            <ul class="navbar-nav">

                                <li class="nav-item">
                                    <a class="nav-link active" href="#">Головна</a>
                                </li>

                                <li class="nav-item dropdown">
                                    <a
                                            class="nav-link dropdown-toggle"
                                            href="#"
                                            role="button"
                                            data-bs-toggle="dropdown"
                                            aria-expanded="false"
                                    >
                                        Послуги
                                    </a>

                                    <ul class="dropdown-menu">
                                        <li>
                                            <a class="dropdown-item" href="#">Вебдизайн</a>
                                        </li>

                                        <li>
                                            <a class="dropdown-item" href="#">Створення сайтів</a>
                                        </li>

                                        <li>
                                            <a class="dropdown-item" href="#">Консультація</a>
                                        </li>
                                    </ul>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="#">Про нас</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="#">Контакти</a>
                                </li>

                            </ul>
                        </div>

                    </div>
                </nav>
                </header>
            </div>
        </div>
    </div>


    <div class="row g-3 mb-3">
        <div class="col-12 col-md-6 col-lg-3">
            <div class="border bg-light p-5 h-100">
                LEFT
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-6">
            <div class="border bg-light p-5 h-100">
                <div class="accordion" id="accordionExample">

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#collapseOne"
                                    aria-expanded="true"
                                    aria-controls="collapseOne">
                                Первый раздел
                            </button>
                        </h2>

                        <div id="collapseOne"
                             class="accordion-collapse collapse show"
                             data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                Содержимое первого раздела.
                            </div>
                        </div>
                    </div>

                    <!-- Второй элемент -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#collapseTwo"
                                    aria-expanded="false"
                                    aria-controls="collapseTwo">
                                Второй раздел
                            </button>
                        </h2>

                        <div id="collapseTwo"
                             class="accordion-collapse collapse"
                             data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                Содержимое второго раздела.
                            </div>
                        </div>
                    </div>

                    <!-- Третий элемент -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#collapseThree"
                                    aria-expanded="false"
                                    aria-controls="collapseThree">
                                Третий раздел
                            </button>
                        </h2>

                        <div id="collapseThree"
                             class="accordion-collapse collapse"
                             data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                Содержимое третьего раздела.
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="border bg-light p-5 h-100">
                RIGHT
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-12">
            <div class="border bg-light p-5">
                FOOTER
            </div>
        </div>
    </div>

</div>


<script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
